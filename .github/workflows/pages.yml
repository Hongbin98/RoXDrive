name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'project-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project-page/package-lock.json
      - run: npm ci
        working-directory: project-page
      - run: npm run build
        working-directory: project-page
      - run: node scripts/prepare-pages.mjs
        working-directory: project-page
      - uses: actions/upload-pages-artifact@v4
        with:
          path: project-page/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
